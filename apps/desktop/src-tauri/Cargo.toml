[package]
name = "slate-desktop"
version = "0.3.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
slate-core = { path = "../../../crates/slate-core" }
tauri = { version = "2", features = [] }
tauri-plugin-sql = { version = "2", features = ["sqlite"] }

[features]
custom-protocol = ["tauri/custom-protocol"]
