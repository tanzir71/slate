name: Deploy Slate website and app
on:
  push:
    tags: ["v*"]
  release:
    types: [published]
  workflow_dispatch:
permissions: { contents: read, pages: write, id-token: write }
concurrency: { group: pages, cancel-in-progress: true }
jobs:
  metadata:
    runs-on: ubuntu-latest
    outputs:
      previews: ${{ steps.release.outputs.previews }}
      commit: ${{ steps.release.outputs.commit }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || github.ref }}
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - name: Resolve release version and immutable commit
        id: release
        run: |
          node --input-type=module <<'JS'
          import { appendFile } from 'node:fs/promises';
          import { execFileSync } from 'node:child_process';
          import { hasDesktopPreviews, readDesktopVersion } from './scripts/desktop-artifacts.mjs';
          const version = await readDesktopVersion(process.cwd(), process.env.GITHUB_REF_TYPE === 'tag' ? process.env.GITHUB_REF_NAME : undefined);
          const commit = execFileSync('git', ['rev-parse', 'HEAD'], { encoding: 'utf8' }).trim();
          await appendFile(process.env.GITHUB_OUTPUT, `previews=${hasDesktopPreviews(version)}\ncommit=${commit}\n`);
          JS
  desktop-previews:
    needs: metadata
    if: needs.metadata.outputs.previews == 'true'
    uses: ./.github/workflows/desktop-preview.yml
    with:
      ref: ${{ needs.metadata.outputs.commit }}
  deploy:
    needs: [metadata, desktop-previews]
    if: ${{ !cancelled() && needs.metadata.result == 'success' && (needs.desktop-previews.result == 'success' || needs.desktop-previews.result == 'skipped') }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.metadata.outputs.commit }}
      - uses: pnpm/action-setup@v4
        with: { version: 10.14.0 }
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium firefox webkit
      - run: pnpm build:site
      - run: pnpm visual
      - run: pnpm e2e
      - run: pnpm perf:menu
      - run: pnpm perf:typing
      - run: pnpm perf:site
      - name: Upload failed browser and performance evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: publication-verification
          path: |
            artifacts/lighthouse-landing*.json
            test-results/
            playwright-report/
          retention-days: 7
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: site-dist }
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Check live app after deployment
        env:
          SLATE_SMOKE_URL: ${{ steps.deployment.outputs.page_url }}app/
        run: node scripts/smoke-site.mjs
  release:
    if: ${{ !cancelled() && needs.deploy.result == 'success' && startsWith(github.ref, 'refs/tags/v') && (github.event_name == 'push' || github.event_name == 'release') }}
    needs: [metadata, deploy]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.metadata.outputs.commit }}
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - name: Download the three verified desktop packages
        if: needs.metadata.outputs.previews == 'true'
        uses: actions/download-artifact@v4
        with:
          pattern: desktop-preview-*
          path: artifacts/release-desktop
          merge-multiple: true
      - name: Publish release and desktop packages after the site is verified
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: node scripts/publish-release.mjs
