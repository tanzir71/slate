name: Deploy Slate website and app
on:
  push:
    tags: ["v*"]
  release:
    types: [published]
  workflow_dispatch:
permissions: { contents: read, pages: write, id-token: write }
concurrency: { group: pages, cancel-in-progress: true }
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || github.ref }}
      - uses: pnpm/action-setup@v4
        with: { version: 10.14.0 }
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium firefox webkit
      - run: pnpm build:site
      - run: pnpm e2e --project=chromium --project=firefox --project=webkit
      - run: pnpm perf:typing --project=chromium --project=firefox --project=webkit
      - run: pnpm perf:site
      - name: Upload failed browser and performance evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: publication-verification
          path: |
            artifacts/lighthouse-landing*.json
            test-results/
            playwright-report/
          retention-days: 7
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: site-dist }
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Check live app after deployment
        env:
          SLATE_SMOKE_URL: ${{ steps.deployment.outputs.page_url }}app/
        run: node scripts/smoke-site.mjs
  release:
    if: startsWith(github.ref, 'refs/tags/v') && github.event_name == 'push'
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Create release notes after the site is verified
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            notes_file="RELEASE_NOTES_${RELEASE_TAG}.md"
            if [ -f "$notes_file" ]; then
              gh release create "$RELEASE_TAG" --verify-tag --notes-file "$notes_file" --title "Slate $RELEASE_TAG"
            else
              gh release create "$RELEASE_TAG" --verify-tag --generate-notes --title "Slate $RELEASE_TAG"
            fi
          fi
