name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.14.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install chromium firefox webkit --with-deps
        if: matrix.os == 'ubuntu-latest'
      - run: pnpm exec playwright install chromium firefox webkit
        if: matrix.os == 'macos-latest'
      - run: pnpm exec playwright install chromium firefox
        if: matrix.os == 'windows-latest'
      - name: Linux desktop prerequisites
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libssl-dev librsvg2-dev libayatana-appindicator3-dev patchelf
      - run: pnpm verify
        if: matrix.os != 'windows-latest'
      - name: Verify Windows (WebKit storage is checked on Linux and macOS)
        if: matrix.os == 'windows-latest'
        run: pnpm typecheck && pnpm lint && pnpm test && pnpm build && pnpm build:site && pnpm perf:site && pnpm perf && pnpm e2e --project=chromium --project=firefox --project=mobile
      - name: Upload failed verification evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: verification-${{ matrix.os }}
          path: |
            artifacts/lighthouse-landing*.json
            test-results/
            playwright-report/
          retention-days: 7

